[project]
name = "api-data-collector"
version = "0.1.0"
description = "Recolector de datos meteorológicos históricos de Pasto usando Open-Meteo."
readme = "README.md"
authors = [
    { name = "guisell02", email = "guisellu886@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
]

[project.scripts]
api-data-collector = "api_data_collector.collector.main:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=25.12.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
]